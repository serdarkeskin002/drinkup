<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Lojistik Platform</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel (JSX için) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [userType, setUserType] = useState(null);
      const [selectedJob, setSelectedJob] = useState(null);

      const jobs = [
        { id: "IS001", from: "İstanbul", to: "Ankara", price: "8.500 ₺", cargo: "İnşaat", weight: "15 ton" },
        { id: "IS002", from: "İstanbul", to: "İzmir", price: "7.200 ₺", cargo: "Elektronik", weight: "8 ton" },
        { id: "IS003", from: "Ankara", to: "Antalya", price: "9.800 ₺", cargo: "Gıda", weight: "12 ton" }
      ];

      if (!userType) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-blue-500 to-purple-600 flex flex-col items-center justify-center p-6">
            <h1 className="text-3xl font-bold text-white mb-2">Lojistik Platform</h1>
            <p className="text-blue-100 mb-8">İşinizi kolaylaştırıyoruz</p>

            <div className="space-y-4 w-full max-w-sm">
              <button
                onClick={() => setUserType("driver")}
                className="w-full bg-white p-5 rounded-xl shadow text-left font-bold"
              >
                🚚 Taşıyıcıyım
                <div className="text-sm font-normal text-gray-600">İş aramak istiyorum</div>
              </button>

              <button
                onClick={() => setUserType("employer")}
                className="w-full bg-white p-5 rounded-xl shadow text-left font-bold"
              >
                💼 İş Verenim
                <div className="text-sm font-normal text-gray-600">Taşıma işi vermek istiyorum</div>
              </button>

              <button
                onClick={() => setUserType("customer")}
                className="w-full bg-white p-5 rounded-xl shadow text-left font-bold"
              >
                📦 Müşteriyim
                <div className="text-sm font-normal text-gray-600">Kargomu takip etmek istiyorum</div>
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-md mx-auto bg-gray-50 min-h-screen">
          <header className="bg-blue-600 text-white p-4 flex justify-between items-center">
            <h2 className="font-bold capitalize">{userType} paneli</h2>
            <button
              onClick={() => setUserType(null)}
              className="text-sm bg-white bg-opacity-20 px-3 py-1 rounded"
            >
              Çıkış
            </button>
          </header>

          <main className="p-4 space-y-3">
            {jobs.map(job => (
              <div
                key={job.id}
                className="bg-white p-4 rounded-xl shadow cursor-pointer"
                onClick={() => setSelectedJob(job)}
              >
                <div className="flex justify-between mb-1">
                  <strong>{job.id}</strong>
                  <span className="text-green-600 font-bold">{job.price}</span>
                </div>
                <div className="text-sm text-gray-600">
                  {job.from} → {job.to}
                </div>
                <div className="text-xs text-gray-500">
                  {job.cargo} • {job.weight}
                </div>
              </div>
            ))}
          </main>

          {selectedJob && (
            <div
              className="fixed inset-0 bg-black bg-opacity-50 flex items-end"
              onClick={() => setSelectedJob(null)}
            >
              <div
                className="bg-white w-full p-6 rounded-t-2xl"
                onClick={e => e.stopPropagation()}
              >
                <h3 className="text-xl font-bold mb-2">{selectedJob.id}</h3>
                <p>{selectedJob.from} → {selectedJob.to}</p>
                <p className="mt-2 font-bold text-green-600">{selectedJob.price}</p>

                <button className="mt-4 w-full bg-green-600 text-white py-3 rounded-lg">
                  Teklif Ver
                </button>

                <button
                  className="mt-2 w-full bg-gray-200 py-2 rounded-lg"
                  onClick={() => setSelectedJob(null)}
                >
                  Kapat
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
